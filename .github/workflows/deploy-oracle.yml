name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ] # Se ejecuta cada vez que haces push a esta rama

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # 1. Entrar a la carpeta del proyecto
            cd esdmgmtsuite
            
            # 2. Bajar los cambios nuevos
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Construir imagen primero y reemplazar contenedor web (evita bug KeyError: 'ContainerConfig' de docker-compose 1.29.2)
            sudo docker-compose build web
            sudo docker-compose rm -s -f web || sudo docker rm -f esdmgmtsuite_web_1 || true
            sudo docker-compose up -d --no-recreate web
            sudo docker ps
            
            # 4. Limpiar imágenes viejas de Docker para que no se llene tu disco
            sudo docker image prune -f

            # 5. Verificación de salud y endpoints v2.9.0
            sleep 4
            echo "=== SMOKE TEST: CADDY PROXY RESOLVE ==="
            curl -s -k --resolve esd360.app:443:127.0.0.1 https://esd360.app/api/normative-limits | head -c 350
            echo ""
            echo "=== SMOKE TEST: FINDINGS DASHBOARD ==="
            curl -s -k --resolve esd360.app:443:127.0.0.1 https://esd360.app/api/findings/dashboard | head -c 350
            echo ""
            echo "=== DOCKER LOGS RECENT ==="
            sudo docker logs --tail 25 esdmgmtsuite_web_1
