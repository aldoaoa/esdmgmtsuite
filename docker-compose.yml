version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Aquí inyectas las variables de entorno para tu backend
      - SUPABASE_URL=tu_url_de_supabase
      - SUPABASE_KEY=tu_anon_key_o_service_role
    expose:
      - "8080" # El puerto interno que expone el Dockerfile

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"   # Puerto HTTP expuesto al internet
      - "443:443" # Puerto HTTPS expuesto al internet
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  # Estos volúmenes son vitales para que Caddy guarde el certificado SSL
  # y no tengas que regenerarlo cada vez que reinicias el servidor.
  caddy_data:
  caddy_config:
