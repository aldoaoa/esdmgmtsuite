      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>
  <!-- Top Robotic Arm Axis -->
  <rect x="18" y="10" width="28" height="8" rx="3" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="3" />
