  <!-- SMT Electronic Chip Being Placed -->
  <rect x="22" y="40" width="20" height="10" rx="2" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="2.5" />
  <!-- Conveyor Rails (Bottom) -->
