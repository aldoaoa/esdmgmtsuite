<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="agyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>
  <!-- 4 Target Corner Brackets -->
  <path d="M10 20 V12 C10 10.9 10.9 10 12 10 H20" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M54 20 V12 C54 10.9 53.1 10 52 10 H44" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M10 44 V52 C10 53.1 10.9 54 12 54 H20" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M54 44 V52 C54 53.1 53.1 54 52 54 H44" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" />

  <!-- QR Pattern Markers (Top-Left, Top-Right, Bottom-Left) -->
  <!-- Top-Left -->
  <rect x="18" y="18" width="10" height="10" rx="2" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="2" />
  <rect x="21" y="21" width="4" height="4" fill="#1E1B4B" />
  <!-- Top-Right -->
  <rect x="36" y="18" width="10" height="10" rx="2" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="2" />
  <rect x="39" y="21" width="4" height="4" fill="#1E1B4B" />
  <!-- Bottom-Left -->
  <rect x="18" y="36" width="10" height="10" rx="2" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="2" />
  <rect x="21" y="39" width="4" height="4" fill="#1E1B4B" />
  <!-- Bottom-Right Small Elements -->
  <rect x="36" y="36" width="4" height="4" fill="#1E1B4B" />
  <rect x="42" y="42" width="4" height="4" fill="#1E1B4B" />

  <!-- Laser Scan Beam (Glowing Cyan/Purple) -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="14" y1="32" x2="50" y2="32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
</svg>
