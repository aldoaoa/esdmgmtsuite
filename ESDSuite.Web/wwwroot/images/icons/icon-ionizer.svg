  <path d="M34 32 C42 32 44 38 44 38 C44 38 37 36 34 32 Z" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="2" />
  <path d="M28 38 C28 46 22 48 22 48 C22 48 24 41 28 38 Z" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="2" />
  <path d="M22 32 C14 32 12 26 12 26 C12 26 19 28 22 32 Z" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="2" />
  <!-- Streaming (+) and (-) Ion Particles Output -->
  <!-- Positive Ion -->
  <circle cx="52" cy="22" r="6" fill="#38BDF8" stroke="#1E1B4B" stroke-width="2" />
  <path d="M52 19 V25 M49 22 H55" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
