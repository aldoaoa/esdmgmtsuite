<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="agyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>
  <!-- Tabletop Surface with ESD mat -->
  <rect x="8" y="24" width="48" height="8" rx="2" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="3" />
  <!-- ESD Mat Top Inset -->
  <rect x="12" y="22" width="40" height="3" rx="1.5" fill="#38BDF8" />
  <!-- Table Legs -->
  <line x1="14" y1="32" x2="14" y2="54" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="32" x2="50" y2="54" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" />
  <!-- Lower Stretcher Beam -->
  <line x1="14" y1="46" x2="50" y2="46" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Grounding Wire & Terminal -->
  <circle cx="44" cy="28" r="2" fill="#1E1B4B" />
  <path d="M44 28 C47 32 43 38 46 42 L46 54" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Ground Symbol -->
  <line x1="42" y1="54" x2="50" y2="54" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="44" y1="57" x2="48" y2="57" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" />
</svg>
