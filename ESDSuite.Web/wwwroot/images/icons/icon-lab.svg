<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="agyGrad" x1="0%" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>
  <!-- IC Package Body -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="url(#agyGrad)" stroke="#1E1B4B" stroke-width="3" />
  <!-- Central Die / Core -->
  <rect x="25" y="25" width="14" height="14" rx="3" fill="#1E1B4B" stroke="#38BDF8" stroke-width="2" />
  <!-- Microchip Pins (Top, Bottom, Left, Right) -->
  <line x1="24" y1="10" x2="24" y2="18" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="10" x2="32" y2="18" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="10" x2="40" y2="18" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />

  <line x1="24" y1="46" x2="24" y2="54" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="46" x2="32" y2="54" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="46" x2="40" y2="54" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />

  <line x1="10" y1="24" x2="18" y2="24" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="10" y1="32" x2="18" y2="32" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="10" y1="40" x2="18" y2="40" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />

  <line x1="46" y1="24" x2="54" y2="24" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="32" x2="54" y2="32" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="40" x2="54" y2="40" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />

  <!-- Test Spark / Pulse -->
  <circle cx="32" cy="32" r="3" fill="#38BDF8" />
</svg>
